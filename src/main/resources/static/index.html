<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GraphQL Product Store</title><style>
body{font:16px Arial;max-width:1100px;margin:30px auto;color:#1f2937}h1{color:#2563eb}
button{background:#2563eb;color:white;border:0;padding:8px 12px;border-radius:5px;cursor:pointer}
input{padding:8px;margin:4px;border:1px solid #cbd5e1;border-radius:4px}.toolbar{display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}
</style></head>
<body><h1>Quản lý sản phẩm</h1><div class="toolbar"><button onclick="loadProducts()">Sắp xếp giá tăng dần</button><button onclick="loadCategories()">Tải danh mục</button></div>
<div id="output">Đang tải...</div><script>
async function gql(query,variables={}){const r=await fetch('/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});const j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data}
async function loadProducts(){const d=await gql('{products{id title quantity desc price userId categories{name}}}');document.querySelector('#output').innerHTML='<table><tr><th>Tên</th><th>Số lượng</th><th>Giá</th><th>Danh mục</th></tr>'+d.products.map(p=>`<tr><td>${p.title}</td><td>${p.quantity}</td><td>${p.price.toLocaleString('vi-VN')}</td><td>${p.categories.map(c=>c.name).join(', ')}</td></tr>`).join('')+'</table>'}
async function loadCategories(){const d=await gql('{categories{id name products{title}}}');document.querySelector('#output').innerHTML='<h2>Danh mục</h2><ul>'+d.categories.map(c=>`<li><b>${c.name}</b>: ${c.products.length} sản phẩm</li>`).join('')+'</ul>'}
loadProducts().catch(e=>document.querySelector('#output').textContent='Lỗi: '+e.message)
</script></body></html>
